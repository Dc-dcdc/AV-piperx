# AV-piper client/runtime environment (Linux x86_64 + NVIDIA GPU).
#
# Design rules:
# - Conda only owns Python and packaging tools. Native Python packages come
#   from wheels built on the target client; do not copy an existing env.
# - PyTorch uses direct links to the official CUDA 12.4 wheels. The host only
#   needs a compatible NVIDIA driver; do not add cuda-version/cuda-runtime.
# - Before creating the environment or launching training on Linux, use:
#     ulimit -S -s 65536
# - Create the environment without inheriting ~/.local packages:
#     PYTHONNOUSERSITE=1 conda env create -f environment.yml
# - After creation, install this repository with:
#     conda run -n AV-piper python -m pip install -e .

name: AV-piper

channels:
  - defaults
  # Ignore extra channels from the client's .condarc; mixing defaults and
  # conda-forge was one source of ABI drift in the old full export.
  - nodefaults

dependencies:
  - python=3.10
  # pip 26.0.1 crashed inside its vendored packaging resolver on one client.
  # Keep the last 25.x release until the client image has been validated.
  - pip=25.3
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      # Official PyTorch 2.5.1 CUDA 12.4 wheels for CPython 3.10/Linux x86_64.
      # Direct URLs prevent pip from searching the PyTorch index for every
      # unrelated package in this environment.
      - torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp310-cp310-linux_x86_64.whl
      - torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp310-cp310-linux_x86_64.whl

      # Numerical/data stack. NumPy 1.26 keeps the vendored LeRobot code and
      # the selected Numba/Zarr versions on their tested pre-NumPy-2 ABI.
      - numpy==1.26.4
      - scipy==1.15.3
      - numba==0.64.0
      - pandas==2.3.3
      - pyarrow==23.0.1
      - datasets==4.7.0
      - h5py==3.16.0
      - numcodecs==0.13.1
      - zarr==2.18.3

      # MuJoCo/PyMJCF. The old export declared lxml 6.0.2 while the working
      # process was actually loading lxml 6.1.1 from ~/.local; pin the real
      # working version and disable user-site overrides below.
      - mujoco==3.5.0
      - dm-control==1.0.37
      - lxml==6.1.1
      - glfw==2.10.0
      - PyOpenGL==3.1.10
      - gymnasium==1.2.3

      # Vision/video and simulation utilities.
      - av==16.1.0
      - opencv-python==4.9.0.80
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - Pillow==12.1.1
      - pygame==2.6.1
      - pymunk==7.2.0
      - matplotlib>=3.8,<4

      # Training, configuration, serialization, and experiment logging.
      - diffusers==0.37.0
      - einops==0.8.2
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - PyYAML==6.0.3
      - huggingface-hub==1.14.0
      - safetensors==0.7.0
      - termcolor==3.3.0
      - tqdm==4.67.3
      - wandb==0.25.1

      # Repository test runner (also useful for client smoke tests).
      - pytest>=8,<9

# Prevent ~/.local/site-packages from silently overriding the environment.
# This exposed the old lxml mismatch between the working host and the client.
variables:
  PYTHONNOUSERSITE: "1"
