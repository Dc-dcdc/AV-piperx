# 原始专家轨迹的主动视角关节偏移增强配置。
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# ===== 1. 输入与输出 =====
# 一次运行处理一个原始Quest遥操作run；SewNeedle和InsertCylinder均可使用。
input_run_dir: outputs/4_data_collect/quest_teleop/quest_teleop_SewNeedle-3Arms-v0_rgb
# 输出保持quest_teleop原始episode格式，后续可单独运行convert_data_to_hf.py。
# 命名：原始episode_000003，增强episode_000003_aug_00～aug_04。
output_run_dir: outputs/4_data_collect/quest_teleop_augmented/quest_teleop_SewNeedle-3Arms-v0_rgb_view_aug_10
# null时读取原run的metadata.json；也可显式覆盖为guided_vision/...。
env_id: null
# 输出同时包含重新按正确时序渲染的原始episode。
include_original: true
# 每条原始episode默认生成5条固定View关节偏移轨迹。
variants_per_episode: 10
# true时跳过已完整生成的episode，并从中断处继续。
resume: true
# 仅用于小规模调试；null表示处理全部源episode。
max_source_episodes: null
# null表示全部；也可填原始episode编号列表，例如[3, 4, 10]。
source_episode_indices: null
# 单个源episode失败后继续处理其余episode。
continue_on_source_error: true

# ===== 2. 可复现的固定关节偏移 =====
seed: 20260730
view_joint_noise:
  # 每个变体从截断高斯分布采样一次，整条episode固定使用该偏移。
  # state与action同步加偏移，学习等价的平移视角轨迹，不是返回原视角的纠偏动作。
  distribution: truncated_gaussian
  # 中间臂[waist, shoulder, elbow, forearm_roll, wrist_1, wrist_2]标准差，单位rad。
  std_rad: [0.025, 0.025, 0.025, 0.040, 0.040, 0.050]
  # 原始采样的绝对上限，单位rad。
  max_abs_rad: [0.060, 0.060, 0.060, 0.100, 0.100, 0.120]
  # 与MuJoCo硬关节限位保留的安全余量，单位rad。
  joint_limit_margin_rad: 0.005
  # 避免采到几乎为0、与原轨迹近似重复的偏移。
  min_normalized_l2: 0.5
  max_sampling_attempts: 1000

# ===== 3. 重放一致性检查 =====
replay_validation:
  # 第一遍采用严格全状态阈值；多数无接触轨迹的误差约为1e-7。
  max_state_abs_error: 1.0e-4
  # 严格校验失败后，清理临时结果并从头重新生成一次。
  retry_on_mismatch: true
  # 回退重试采用分组阈值，来自当前100条SewNeedle源轨迹的全量重放审计。
  retry_max_arm_joint_abs_error: 2.0e-3
  retry_max_gripper_abs_error: 5.0e-3
  # 主动视角臂不参与任务接触，继续保持更严格的重放约束。
  retry_max_view_joint_abs_error: 1.0e-5

# ===== 4. 双目渲染与视频 =====
cameras: [zed_cam_left, zed_cam_right]
render_height: 480
render_width: 640
fps: 25
video:
  codec: libx264
  pixel_format: yuv420p
  crf: 23
  gop: 2
  macro_block_size: 1

# ===== 5. 服务器渲染设备 =====
# auto不覆盖当前环境；服务器通常设为egl。
mujoco_gl: auto
# egl时可指定GPU编号；null表示交给MuJoCo/EGL自动选择。
render_device: null

# ===== 6. Hydra输出控制 =====
hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
