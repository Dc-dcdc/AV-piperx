# 旧 InsertCylinder 原始轨迹的容器静态 body 初态回填实验。
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# ===== 1. 输入、报告与试验范围 =====
input_run_dir: outputs/4_data_collect/quest_teleop/quest_teleop_InsertCylinder-3Arms-v0_rgb
# 默认只写恢复报告、搜索曲线和诊断图，不修改源run。
report_dir: outputs/4_data_collect/container_state_backfill/InsertCylinder-3Arms-v0_pilot
# null表示按目录顺序选取；也可显式填写[0, 1, 2, 3, 4]。
source_episode_indices: null
# 首次先验证前10条；确认可靠后改为null处理全部。
max_source_episodes: 100
resume: true
continue_on_error: true
# 新格式轨迹已经包含model body初态时直接跳过。
skip_existing_model_state: true

# ===== 2. 环境与原视频规格 =====
fps: 25
cameras: [zed_cam_left, zed_cam_right]
render_height: 480
render_width: 640

# ===== 3. 黄色容器圆环可见帧选择 =====
search:
  # InsertCylinder reset()中的容器y随机范围，单位m。
  y_min_m: 0.05
  y_max_m: 0.25
  # 先以2 mm粗搜索，再在最优点附近±3 mm使用0.1 mm细搜索。
  coarse_step_m: 0.002
  fine_radius_m: 0.003
  fine_step_m: 0.0001
  # 成功轨迹后半段更容易看见容器；0.55表示只扫描后45%视频。
  tail_start_fraction: 0.55
  tail_end_fraction: 1.0
  observations_per_camera: 3
  # 防止选出的3帧都来自几乎相同的连续画面。
  min_frame_separation_fraction: 0.04

mask:
  # OpenCV HSV范围；H范围为0～179，S/V范围为0～255。
  hsv_lower: [15, 150, 140]
  hsv_upper: [38, 255, 255]
  min_area_px: 20
  max_area_px: 2000
  min_width_px: 5
  max_width_px: 100
  min_height_px: 4
  max_height_px: 80
  min_aspect_ratio: 0.55
  max_aspect_ratio: 3.2
  min_fill_ratio: 0.12
  max_fill_ratio: 0.72
  border_margin_px: 2
  # 当前黄色圆环在透视下通常接近1.65宽高比、0.32填充率。
  expected_aspect_ratio: 1.65
  expected_fill_ratio: 0.32
  fill_score_scale: 1.5

# ===== 4. 原RGB圆环与MuJoCo geom分割mask匹配 =====
matching:
  mask_dilation_radius_px: 1
  centroid_scale_px: 5.0
  iou_weight: 0.60
  centroid_weight: 0.25
  area_weight: 0.15

# ===== 5. 自动置信度判定 =====
confidence:
  min_observations_per_camera: 2
  min_match_score: 0.70
  max_camera_disagreement_m: 0.002
  max_frame_std_m: 0.002
  # 最优位置必须明显优于距离至少5 mm的候选。
  score_separation_m: 0.005
  min_score_margin: 0.05
  # 排除圆环区域后，原视频与当前MuJoCo渲染背景应基本一致。
  max_background_rgb_mae: 0.08

replay:
  # 回填依赖原动作重放；误差过大说明代码/模型与采集时期不一致。
  max_agent_state_abs_error: 0.005

# ===== 6. 诊断输出 =====
diagnostics:
  save_images: true
  save_search_scores: true
  rgb_exclusion_radius_px: 4

# ===== 7. 安全输出开关 =====
output:
  # false只生成报告；人工确认5～10条诊断图后才改为true。
  write_recovered_run: false
  recovered_run_dir: outputs/4_data_collect/quest_teleop_recovered/quest_teleop_InsertCylinder-3Arms-v0_rgb_container_recovered
  # true时只有high结果才进入新run，低置信度轨迹留待重新采集。
  only_high_confidence: true
  # hardlink不重复占用空间；若跨文件系统，代码会自动降级为copy。
  video_copy_mode: hardlink

# ===== 8. 服务器渲染 =====
mujoco_gl: auto
render_device: null

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
