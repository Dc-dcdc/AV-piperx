# Quest3 -> MuJoCo 遥操数据采集默认配置

# ===== 1. Quest3 位姿通信 =====
host: 0.0.0.0  # 监听所有网卡地址
port: 5005  # Quest3 数据接收端口
timeout: 0.05  # socket 超时阈值，单位秒

# ===== 2. 数据保存 =====
output_dir: outputs/4_data_collect/quest_teleop  # 采集数据输出根目录
run_name: null     # 本次采集名称，null 表示按任务名自动生成
append: true       # 是否追加到已有 run_name 目录，同一任务默认写入同一数据集
fps: 25            # 数据时间戳和相机视频帧率
save_videos: true  # 是否直接保存每条 episode 的相机 mp4 视频
save_pose_action: true  # 是否额外保存 Quest 映射后的末端位姿动作
min_steps_to_save: 2     # episode 少于该步数时自动丢弃
max_steps_per_episode: 1000    # 单条 episode 最大采集步数
record_cameras:   # 保存到数据集中的相机，需和训练配置 input_shapes 对齐
  - zed_cam_left
  - zed_cam_right
  - wrist_cam_left
  - wrist_cam_right
  - overhead_cam
  - worms_eye_cam


# ===== 3. 仿真与控制 =====
env_id: guided_vision/SewNeedle-3Arms-v0  # Gymnasium 仿真环境 ID
hand_position_scale: 1.0      # 左右手柄位移映射到左右臂末端的缩放系数
head_position_scale: 1.0      # 头显位移映射到中间臂末端的缩放系数
hand_max_delta: 1.0           # 左右臂末端相对锚点的最大位移
head_max_delta: 1.0           # 中间臂末端相对锚点的最大位移
head_control: true            # 是否使用头显控制中间臂
individual_hand_anchors: true  # 左右臂是否分别使用各自手柄锚点
lock_roll: true               # 是否锁定中间臂 roll 角
lock_pitch: false             # 是否锁定中间臂 pitch 角，true 时禁用抬头低头
episode_length: 100000        # 环境内部最大 episode 长度
workspace_low: null           # 末端目标工作空间下界，格式 [x, y, z]
workspace_high: null          # 末端目标工作空间上界，格式 [x, y, z]
mujoco_gl: auto               # MuJoCo 渲染后端，auto/glfw/egl/osmesa
allow_partial_anchor: false   # 是否允许部分 Quest 设备可用时就锚定
start_on_first_packet: false  # 是否在首帧有效 Quest 数据到达后启动

# ===== 4. 图像观测与显示 =====
display_camera: zed_cam_left  # 本地窗口和 Unity 图像流使用的相机
render_width: 640   # 渲染图像宽度
render_height: 480  # 渲染图像高度
window_name: Quest3 Teleop Collect  # 本地 OpenCV 窗口名称
viewer: true                  # 是否打开 MuJoCo viewer
camera_window: true           # 是否打开本地 OpenCV 相机窗口

# ===== 5. 发送给 Unity/Quest 的画面 =====
unity_image_stream: true       # 是否向 Unity/Quest 发送渲染图像
unity_image_host: auto         # Unity 图像接收端 IP，auto 表示跟随 Quest 来源 IP
unity_image_port: 5010         # Unity 图像接收端 UDP 端口
unity_image_hz: 25.0           # 图像发送帧率，这需要与SIM_DT时间对齐
unity_image_jpeg_quality: 55   # JPEG 压缩质量，范围 1-100
unity_image_chunk_size: 1000   # UDP 图像分片大小，单位字节
unity_image_log_interval: 2.0  # 图像发送状态打印间隔，0 表示不打印

# ===== 6. 状态打印 =====
status_hz_interval: 0.5  # 终端状态打印间隔，单位秒
