# Quest3 -> MuJoCo 遥操数据采集默认配置
defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# ===== 1. Quest3 位姿通信 =====
host: 0.0.0.0  # 监听所有网卡地址
port: 5005  # Quest3 数据接收端口
timeout: 0.05  # socket 超时阈值，单位秒

# ===== 2. 数据保存 =====
output_dir: outputs/4_data_collect/quest_teleop  # 采集数据输出根目录
run_name: null     # 本次采集名称，null 表示按任务名自动生成
append: true       # 是否追加到已有 run_name 目录，同一任务默认写入同一数据集
fps: 25            # 数据采集、时间戳和相机视频帧率
save_rgb: true     # 是否在 A+X 确认保存后回放轨迹并渲染 RGB 视频，不影响实时遥操闭环
save_videos: true  # 是否将回放渲染出的 RGB 图像保存为每条 episode 的 mp4 视频，需 save_rgb=true
save_depth: false  # 是否保存 record_cameras 中每个相机的逐像素深度图，保存到 arrays.npz 的 depth__相机名
video_queue_size: 300  # 后台视频写入队列容量，越大越不易卡顿但占用更多内存
save_pose_action: true  # 是否额外保存经过下方 pose_filter 平滑后、实际送入 IK 的末端位姿动作
save_reward_debug: false  # 是否单独保存 reward_debug.jsonl，用于分析奖励函数，不写入训练用 arrays.npz
min_steps_to_save: 2     # episode 少于该步数时自动丢弃
max_steps_per_episode: 1000    # 单条 episode 最大采集步数
record_cameras:   # 保存到数据集中的相机，需和训练配置 input_shapes 对齐
  - zed_cam_left
  - zed_cam_right
  - wrist_cam_left
  - wrist_cam_right
  - overhead_cam
  - worms_eye_cam


# ===== 3. 仿真与控制 =====
# guided_vision/OpenDrawerRetrieve-3Arms-v0
# guided_vision/InsertPeg-3Arms-v0
# guided_vision/SewNeedle-3Arms-v0
# guided_vision/InsertCylinder-3Arms-v0
env_id: guided_vision/InsertPeg-3Arms-v0  # Gymnasium 仿真环境 ID，必须包含guided_vision命名空间
hand_position_scale: 1      # 左右手柄位移映射到左右臂末端的缩放系数
head_position_scale: 1      # 头显位移映射到中间臂末端的缩放系数
hand_max_delta: 1.0           # 左右臂末端相对锚点的最大位移
head_max_delta: 1.0           # 中间臂末端相对锚点的最大位移
head_control: true            # 是否使用头显控制中间臂
individual_hand_anchors: true  # 左右臂是否分别使用各自手柄锚点
lock_roll: true               # 是否锁定中间臂 link6 转轴对应的 roll
lock_pitch: false             # 是否锁定中间臂 pitch 角，true 时禁用抬头低头
episode_length: 100000        # 环境内部最大 episode 长度
workspace_low: null           # 末端目标工作空间下界，格式 [x, y, z]
workspace_high: null          # 末端目标工作空间上界，格式 [x, y, z]
mujoco_gl: auto               # MuJoCo 渲染后端，auto/glfw/egl/osmesa
allow_partial_anchor: false   # 是否允许部分 Quest 设备可用时就锚定
start_on_first_packet: false  # 是否在首帧有效 Quest 数据到达后启动

# ===== 4. Quest 位姿平滑与防抖 =====
pose_filter:
  enabled: false                 # 是否在 Quest 位姿映射后、IK 求解前启用滤波
  position_min_cutoff: 1.0      # One Euro 静止时截止频率；越小越平滑，但延迟越大
  position_beta: 0.08           # One Euro 速度自适应系数；越大则快速运动时响应越快
  position_d_cutoff: 1.0        # One Euro 速度估计的截止频率
  rotation_alpha: 0.35          # 四元数 SLERP 中当前帧权重，范围 (0, 1]
  max_position_step: 0.010      # 相邻控制帧最大末端位移，单位米；0 表示不限制
  max_rotation_step_deg: 5.0    # 相邻控制帧最大旋转角，单位度；0 表示不限制
  gripper_alpha: 0.4            # 手爪扳机指数平滑中当前帧权重，范围 (0, 1]
  gripper_deadband: 0.02        # 手爪相对上次输出小于该值时保持不变
  tracking_reset_gap: 0.25      # 超过该秒数无控制帧时重置速度估计，同时保留突跳限幅

# ===== 5. 图像观测与显示 =====
display_camera: zed_cam_left  # 本地窗口和 Unity 图像流使用的相机
render_width: 640   # 渲染图像宽度
render_height: 480  # 渲染图像高度
window_name: Quest3 Teleop Collect  # 本地 OpenCV 窗口名称
viewer: true                  # 是否打开 MuJoCo viewer
camera_window: false          # 是否打开本地 OpenCV 相机窗口，关闭可减少一次额外渲染
depth_window: false           # 是否打开本地 OpenCV 深度图窗口，仅用于查看，不影响保存数据
depth_window_name: Quest3 Teleop Depth  # 本地深度图窗口名称
depth_display_camera: null    # 深度图窗口使用的相机，null 表示跟随 display_camera
depth_vis_min: 0.0            # 深度图显示归一化下限，单位为 MuJoCo 世界长度
depth_vis_max: 2.0            # 深度图显示归一化上限，单位为 MuJoCo 世界长度

# ===== 6. 发送给 Unity/Quest 的画面 =====
unity_image_stream: true       # 是否向 Unity/Quest 发送渲染图像
unity_image_source: rgb        # 发送给 Unity/Quest 的画面来源，支持 rgb/depth
unity_image_stereo: false      # 是否按 [左眼|右眼] 横向拼接发送给 Quest，用于 Unity 立体显示
unity_left_camera: zed_cam_left   # 立体显示左眼使用的 MuJoCo 相机
unity_right_camera: zed_cam_right # 立体显示右眼使用的 MuJoCo 相机
unity_image_host: auto         # Unity 图像接收端 IP，auto 表示跟随 Quest 来源 IP
unity_image_port: 5010         # Unity 图像接收端 UDP 端口
unity_image_hz: 25.0           # 图像发送帧率，通常与 fps 保持一致
unity_image_jpeg_quality: 55   # JPEG 压缩质量，范围 1-100
unity_image_chunk_size: 1000   # UDP 图像分片大小，单位字节
unity_image_log_interval: 2.0  # 图像发送状态打印间隔，0 表示不打印

# ===== 7. 状态打印 =====
status_hz_interval: 0.5  # 终端状态打印间隔，单位秒

# ===== 8. Hydra 输出控制 =====
hydra:
  run:
    dir: .  # 不额外创建 outputs/日期/时间 运行目录
  job:
    chdir: false  # 运行时不切换工作目录
  output_subdir: null  # 不保存 .hydra 配置快照
