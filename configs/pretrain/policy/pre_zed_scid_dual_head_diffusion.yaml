# @package _global_
# SCID: Arm扩散完整动作，View扩散Arm无法解释的创新残差。

seed: 1000

override_dataset_stats:
  observation.images.zed_cam_left:
    mean: [[[0.485]], [[0.456]], [[0.406]]]
    std: [[[0.229]], [[0.224]], [[0.225]]]
  observation.images.zed_cam_right:
    mean: [[[0.485]], [[0.456]], [[0.406]]]
    std: [[[0.229]], [[0.224]], [[0.225]]]

training:
  lr_scheduler: "cosine"
  lr_warmup_steps: 5000
  offline_steps: 200000
  online_steps: 0
  save_freq: 100
  eval_freq: 100
  save_checkpoint: true
  num_workers: 4
  batch_size: 32
  lr: 1e-4
  lr_backbone: 1.0e-5
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  weight_decay: 1.0e-6
  grad_clip_norm: 10
  online_steps_between_rollouts: 1
  delta_timestamps:
    action: "[i / ${env.fps} for i in range(${policy.horizon})]"
    observation.state: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"
    observation.images.zed_cam_left: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"
    observation.images.zed_cam_right: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"

policy:
  name: scid_dual_head_diffusion

  # 双头语义保持不变，但第二头的扩散坐标由原始View改为创新残差。
  arm_action_dim: 14
  view_action_dim: 6
  view_loss_weight: 0.2

  # G=Cov(V,A)(Cov(A)+ridge*I)^-1；拟合后G/b/scale随checkpoint保存。
  scid_ridge: 0.001
  scid_residual_eps: 1.0e-6
  scid_clamp_reconstructed_view: true

  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8

  resize_shape: [240, 320]
  crop_shape: [216, 288]
  crop_is_random: true
  input_shapes:
    observation.images.zed_cam_left: [3, 480, 640]
    observation.images.zed_cam_right: [3, 480, 640]
    observation.state: ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  input_normalization_modes:
    observation.images.zed_cam_left: mean_std
    observation.images.zed_cam_right: mean_std
    observation.state: mean_std
  output_normalization_modes:
    action: min_max

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  use_group_norm: false
  spatial_softmax_num_keypoints: 32

  down_dims: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  noise_scheduler_type: DDIM
  num_inference_steps: 10
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

  # 保留现有配置字段；当前训练代码的EMA行为与原dual-head一致。
  use_ema: true
  ema_update_after_step: 1000
