# @package _global_

seed: 1000

# wandb:
#   project: ${env.task}_pretrain_coupled_dual_head

override_dataset_stats:
  observation.images.zed_cam_left:
    mean: [[[0.485]], [[0.456]], [[0.406]]]
    std: [[[0.229]], [[0.224]], [[0.225]]]
  observation.images.zed_cam_right:
    mean: [[[0.485]], [[0.456]], [[0.406]]]
    std: [[[0.229]], [[0.224]], [[0.225]]]


training:
  lr_scheduler: "cosine"
  lr_warmup_steps: 5000
  offline_steps: 200000
  online_steps: 0
  save_freq: 2000
  eval_freq: 2000
  save_checkpoint: true
  num_workers: 4
  batch_size: 32
  lr: 1e-4
  lr_backbone: 1.0e-5
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  # 仅用于UNet/视觉等原有参数；Attention/AdaLN/FFN/gate由优化器参数组覆盖为0。
  weight_decay: 1.0e-6
  grad_clip_norm: 10
  online_steps_between_rollouts: 1
  delta_timestamps:
    action: "[i / ${env.fps} for i in range(${policy.horizon})]"
    observation.state: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"
    observation.images.zed_cam_left: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"
    observation.images.zed_cam_right: "[(-i) / ${env.fps} for i in reversed(range(${policy.n_obs_steps}))]"

policy:
  name: coupled_dual_head_diffusion

  # 完整20维动作按机器人角色拆为操作头和主动视角头。
  arm_action_dim: 14
  view_action_dim: 6
  view_loss_weight: 0.5

  # 两个UNet在每个去噪时间步的瓶颈层做双向交叉注意力。
  coupling_num_heads: 8
  coupling_dropout: 0.0

  # coupling_mode控制两个动作头在UNet瓶颈层的时间token路由。
  # 当前horizon=16、down_dims=[128,256,512]，瓶颈时间维被压缩为4个token [0,1,2,3]。
  # 注意：这些token表示压缩后的连续时间片段，不等同于4个原始动作时刻。
  #
  # full（全时域双向耦合）：
  #   每个Arm token读取全部View token [0,1,2,3]；
  #   每个View token读取全部Arm token [0,1,2,3]，并写回所有token。
  #
  # rbac（跨重规划边界的角色非对称耦合）：
  #   Arm token [3]读取View前缀[0,1,2]；
  #   View前缀[0,1,2]读取Arm token [3]。
  #   即View已执行/当前前缀修正Arm未来后缀，Arm未来意图反向预览给View前缀。
  #
  # balanced_lookahead（等分前瞻耦合）：
  #   Arm当前前缀[0,1]读取View未来后缀[2,3]；
  #   View当前前缀[0,1]读取Arm未来后缀[2,3]；
  #   耦合残差只写回双方前缀[0,1]，后缀[2,3]保持不变。
  #
  # rcla（Role-Causal Lag Attention，角色因果时滞注意力）：
  #   Arm token i仅读取View token {i-1,i}，越界位置自动忽略；
  #   View token i仅读取Arm token {i,i+1}，越界位置自动忽略；
  #   例如Arm[2]<-View{1,2}，View[2]<-Arm{2,3}，所有token均可被局部修正。
  #
  # bidirectional_prefix_to_suffix（双向执行边界前缀到后缀耦合）：
  #   Arm token [3]读取View前缀[0,1,2]；
  #   View token [3]读取Arm前缀[0,1,2]；
  #   双方前缀保持不变，仅由对方较可靠的前缀修正自己的未来后缀。
  #
  # bidirectional_half_prefix_to_suffix （双向前半段到后半段耦合，当前启用）：
  #   Arm token [2,3]分别加权读取View前缀{0,1}；
  #   View token [2,3]分别加权读取Arm前缀{0,1}；
  #   双方前缀[0,1]保持不变，仅修正双方后缀[2,3]。
  coupling_mode: bidirectional_prefix_to_suffix

  # coupling_block_type与上面的时间路由正交：
  #   scalar_gate: 原始LayerNorm + 每方向一个时间步标量gate，兼容旧checkpoint。
  #   role_adaln_zero: 使用DiT式角色独立adaLN-Zero调制注意力输入。
  coupling_block_type: role_adaln_zero
  # 固定一维正弦编码显式标记4个压缩时间token的位置；只进入耦合分支。
  coupling_use_temporal_pos_emb: true
  # 在交叉注意力后增加角色独立、零门控FFN，并沿用coupling_mode的写回位置。
  coupling_use_ffn: false
  coupling_ffn_ratio: 2.0

  # 仅在低噪声去噪阶段启用耦合：有效gate=1[t<=阈值]×学习gate。
  # null表示所有时间步均启用；当前100个训练时间步、DDIM推理10步时，
  # 20会使典型推理序列[90,80,...,20,10,0]只在最后3步开放Attention/FFN。
  coupling_active_max_timestep: 0

  # 同一checkpoint推理消融：0关闭对应方向，1保持训练时完整耦合。
  view_to_arm_coupling_scale: 0.5   # View前3个瓶颈token修正Arm最后1个token
  arm_to_view_coupling_scale: 0.5   # Arm前3个瓶颈token修正View最后1个token

  # 按原版Diffusion Policy规则，从最后一帧历史观测对应的动作开始执行。
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8

  resize_shape: [240, 320]
  crop_shape: [216, 288]
  crop_is_random: true
  input_shapes:
    observation.images.zed_cam_left: [3, 480, 640]
    observation.images.zed_cam_right: [3, 480, 640]
    observation.state: ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  input_normalization_modes:
    observation.images.zed_cam_left: mean_std
    observation.images.zed_cam_right: mean_std
    observation.state: mean_std
  output_normalization_modes:
    action: min_max

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  use_group_norm: false
  spatial_softmax_num_keypoints: 32

  down_dims: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  noise_scheduler_type: DDIM
  num_inference_steps: 10
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

  # 在线模型正常参与反向传播；EMA在1000步时复制在线权重，之后仅用于评估和部署。
  use_ema: true
  ema_update_after_step: 1000
