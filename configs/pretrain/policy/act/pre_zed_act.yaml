# @package _global_

seed: 1000

override_dataset_stats:
  observation.images.zed_cam_left:
    # stats from imagenet, since we use a pretrained vision model
    mean: [[[0.485]], [[0.456]], [[0.406]]]  # (c,1,1)
    std: [[[0.229]], [[0.224]], [[0.225]]]  # (c,1,1)
  observation.images.zed_cam_right:
    # stats from imagenet, since we use a pretrained vision model
    mean: [[[0.485]], [[0.456]], [[0.406]]]  # (c,1,1)
    std: [[[0.229]], [[0.224]], [[0.225]]]  # (c,1,1)

training:
  offline_steps: 200000
  online_steps: 0
  eval_freq: 2000    # 评估频率
  save_freq: 2000    # 保存频率
  log_freq: 100      # 打印频率
  save_checkpoint: true
  num_workers: 4
  batch_size: 16
  lr: 2.5e-5
  lr_backbone: 1e-5
  weight_decay: 1e-6
  grad_clip_norm: 10

  delta_timestamps:
    action: "[i / ${env.fps} for i in range(${policy.chunk_size})]"

# ACT使用双路480x640图像；单卡上异步评估会额外复制模型并创建多套MuJoCo渲染上下文。
# 默认采用同步小批量评估避免与训练进程叠加显存。双GPU服务器可在命令行覆盖为
# eval.async_enabled=true eval.device=cuda:1 eval.batch_size=15。
eval:
  async_enabled: true
  batch_size: 2


# See `configuration_act.py` for more details.
policy:
  name: act

  # Input / output structure.
  n_obs_steps: 1
  chunk_size: 50 # chunk_size
  n_action_steps: 50

  input_shapes:
    # TODO(rcadene, alexander-soare): add variables for height and width from the dataset/env?
    observation.images.zed_cam_left: [3, 480, 640]
    observation.images.zed_cam_right: [3, 480, 640]
    observation.state: ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization / Unnormalization
  input_normalization_modes:
    observation.images.zed_cam_left: mean_std
    observation.images.zed_cam_right: mean_std
    observation.state: mean_std
  output_normalization_modes:
    action: min_max

  # Architecture.
  # Vision backbone.
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  replace_final_stride_with_dilation: false
  # Transformer layers.
  pre_norm: false
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  feedforward_activation: relu
  n_encoder_layers: 4
  # Note: Although the original ACT implementation has 7 for `n_decoder_layers`, there is a bug in the code
  # that means only the first layer is used. Here we match the original implementation by setting this to 1.
  # See this issue https://github.com/tonyzhaozh/act/issues/25#issue-2258740521.
  n_decoder_layers: 1
  # VAE.
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4

  # Inference.
  temporal_ensemble_coeff: null #是否使用时序融合

  # Training and loss computation.
  dropout: 0.1
  kl_weight: 10.0
  # ==========================================
  # 5. 推理与 EMA (Inference & EMA)
  # ==========================================
  use_ema: true                       # 在线模型正常训练，EMA影子模型用于评估和部署
  ema_update_after_step: 1000         # 到该步先精确复制online，之后才开始滑动平均