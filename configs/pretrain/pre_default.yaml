defaults:
  - _self_
  # 默认加载的环境和策略
  - env: sim_insert_cylinder_3arms
  - policy: pre_zed_diffusion

hydra:
  run:
    dir: outputs/2_pretrain/${env.task}/${now:%Y-%m-%d}/${now:%H-%M-%S}_${env.task}_${hydra.runtime.choices.policy}
    # ${hydra.runtime.choices.policy}就是对应的policy名称，如果直接写${policy}会把文件里的参数都放进去
  job:
    name: ${hydra.runtime.choices.policy}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  
  job_logging:
    handlers:
      file:
        #将日志文件写入模式改为追加 (append)
        mode: a
# 将 `resume` 设置为 true 以恢复之前的运行。为此，您需要确保hydra.run.dir是至少包含一个检查点的现有运行目录。
# resume会从checkpoint恢复策略/环境等训练语义配置以及模型、优化器、调度器和训练步数。
# 当前配置仅覆盖device/use_amp、训练时长与记录频率、数据加载性能、评估吞吐和wandb设置。
resume: false
resume_path: none
device: "cuda:0"  # cuda或cpu

# 把部分计算从 float32 改成 float16，速度快 30%~100%
use_amp: True
amp_dtype: bfloat16
use_grad_scaler: auto
# `seed` is used for training (eg: model initialization, dataset shuffling)
# AND for the evaluation environments.
seed: ???
# You may provide a list of datasets here. `train.py` creates them all and concatenates them. Note: only data
# keys common between the datasets are kept. Each dataset gets and additional transform that inserts the
# "dataset_index" into the returned item. The index mapping is made according to the order in which the
# datsets are provided.
dataset_local_dir: null   # 可以从本地数据集加载
dataset_repo_id: lerobot/pusht
view_delta_stats_cache_dir: outputs/buffer/view_action_delta_stats  # View增量统计缓存；不修改数据集原始stats。
video_backend: pyav # 视频解码引擎，读取视频文件转化为图像张量

eval:
  # 训练与评估设备接口。单GPU/同步模式保持async_enabled=false；
  # 双GPU可设根节点device=cuda:0、eval.device=cuda:1并开启异步评估。
  async_enabled: true
  device: ${device}
  max_pending: 1          # 包含正在运行的任务；限制积压旧checkpoint
  skip_if_busy: true      # 评估落后时跳过中间任务，最终step始终等待
  wait_at_end: true       # 训练结束前等待最终评估与Top-K落盘
  startup_timeout_s: 180  # MuJoCo/VectorEnv子进程初始化超时
  shutdown_timeout_s: 30
  checkpoint_metric: "success" # 筛选指标：可选 'loss'、'reward'、'success'
  max_checkpoints: 20     # 最多保存loss最小的几个模型快照
  n_episodes: 100              # 每次评估跑多少个完整的 episode
  max_episodes_rendered: 1    # 最多保存前几个 episode 的录像视频
  # `batch_size` specifies the number of environments to use in a gym.vector.VectorEnv.
  batch_size: 15              # 每次并行评估环境数量
  use_async_envs: true       # 是否使用异步环境并行评估，true时每个环境独立运行，false时所有环境同步运行
  records_resume: true  # 是否读取top-k的快照和视频列表 即top_k_records.json
  fps: 25               # 录制的 MP4 视频帧率
  seed: 100            # 评估时的随机种子
  render_camera : ['zed_cam_left']                           # 评估时保存的video视角相机


training:
  eval_freq: 2000
  log_freq: 100           # 多少步记录一次日志，会在终端输出，并上传wandb
  save_checkpoint: true 
  persistent_workers: true # 多worker DataLoader跨epoch复用进程，减少视频/图像加载抖动
  prefetch_factor: 2       # 每个worker预取batch数；大图像训练时可按内存调到3或4
  
  image_transforms:
  # These transforms are all using standard torchvision.transforms.v2
  # You can find out how these transformations affect images here:
  # https://pytorch.org/vision/0.18/auto_examples/transforms/plot_transforms_illustrations.html
  # We use a custom RandomSubsetApply container to sample them.
  # For each transform, the following parameters are available:
  #   weight: This represents the multinomial probability (with no replacement)
  #           used for sampling the transform. If the sum of the weights is not 1,
  #           they will be normalized.
  #   min_max: Lower & upper bound respectively used for sampling the transform's parameter
  #           (following uniform distribution) when it's applied.
    # Set this flag to `true` to enable transforms during training
    enable: false
    # This is the maximum number of transforms (sampled from these below) that will be applied to each frame.
    # It's an integer in the interval [1, number of available transforms].
    max_num_transforms: 3
    # By default, transforms are applied in Torchvision's suggested order (shown below).
    # Set this to True to apply them in a random order.
    random_order: true
    brightness:
      weight: 1
      min_max: [0.8, 1.2]
    contrast:
      weight: 1
      min_max: [0.8, 1.2]
    saturation:
      weight: 1
      min_max: [0.5, 1.5]
    hue:
      weight: 1
      min_max: [-0.05, 0.05]
    sharpness:
      weight: 1
      min_max: [0.8, 1.2]

policy:
  do_mask_loss_for_padding: false
  # 单头/双头Diffusion策略的View动作语义：absolute保持原绝对关节目标；
  # delta_from_current 使整个未来动作块相对本次重规划的当前View关节。
  # 默认保留absolute，启用新实验时通过policy.view_action_representation覆盖。
  view_action_representation: absolute
  # 所有Diffusion预训练策略共用的EMA衰减系数；仅在对应策略use_ema=true时生效。
  # 越接近1越平滑、滞后越明显，例如0.999约对应最近1000次更新的平滑窗口。
  ema_decay: 0.999
  # 可微FK末端位姿监督公共配置。支持diffusion、dual_head_diffusion、
  # coupled_dual_head_diffusion训练链路。
  # 两个系数均为0时不创建FK模块、不重建x0，也不增加训练计算量。
  eef_pose_position_loss_weight: 0.0  # 末端位置平方误差权重，误差单位为m²。  1.0
  eef_pose_rotation_loss_weight: 0.0  # SO(3)测地角平方误差权重，单位为rad²。  0.01
  # 仅对t<=该值的低噪声样本启用位姿监督；null表示所有扩散时间步都启用。
  eef_pose_loss_max_timestep: 20

wandb:
  enable: true
  disable_system_stats: true  # 不采集或上传CPU、GPU、内存等周期性System指标
  disable_machine_info: true  # 不上传主机与硬件信息
  # Set to true to disable saving an artifact despite save_checkpoint == True
  disable_artifact: true # 不保存artifact，即不上传权重模型
  project: ${env.task}_pretrain #项目名称
  notes: ""
  save_code: false  # 是否保存代码
