# @package _global_
# ZED-only Diffusion checkpoint 的 DPPO 微调配置。
# 可用命令查看最终合并结果:
# python train/s3_finetune/finetune_dppo.py policy=ft_zed_diffusion --cfg job

seed: 1000

env:
  n_envs: 2

training:
  pretrained_ckpt_path: null
  n_train_itr: 1000
  n_critic_warmup_itr: 2
  rollout_steps: 800
  batch_size: 16
  update_epochs: 10

  actor_lr: 1e-7
  critic_lr: 5e-5
  critic_hidden_dims: [256, 256, 256]
  critic_activation: Mish
  critic_use_layernorm: false
  actor_weight_decay: 0.0
  critic_weight_decay: 0.0
  train_vision_encoder: false # 是否训练视觉底座模型参数
  lr_backbone: 1e-5
  actor_lr_warmup_iters: 5

  gamma: 0.999
  gae_lambda: 0.95
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3.0
  gamma_denoising: 0.99
  target_kl: 1e-4
  bc_coef: 0.0             # BC 正则/teacher 约束；设为0可对齐原版图像UNet DPPO

  reward_source: "binary_success_label"
  reward_scale_running: false
  reward_scale_const: 1.0
  norm_adv: true
  clip_advantage_lower_quantile: 0.05
  clip_advantage_upper_quantile: 0.95

  min_sampling_denoising_std: 0.01   # DDIM采样探索标准差；越大探索性越强
  min_logprob_denoising_std: 0.01    # 与采样标准差保持一致，避免old/new logprob尺度不匹配
  ddim_eta: 0.0                      # 原版DPPO DDIM随机性系数，mu中会使用sigma项
  randn_clip_value: 3.0              # 原版DPPO采样噪声裁剪范围
  logprob_reduction: mean
  use_disk_cache: true
  disk_cache_dir: "outputs/buffer/finetune_dppo"
  grad_accumulate: 32                 # 梯度累计步数  16*32=512
  post_update_probe_size: 256
  rollout_policy: dppo
  skip_update: false
  update_actor: true
  ref_bc_early_stop: 4.0

  min_actor_update_success_rate: 0.0
  min_actor_update_avg_return: -100.0
  rollback_on_eval_collapse: true
  rollback_success_rate: 0.1
  rollback_reward: -100.0
  rollback_patience: 1

eval:
  eval_freq: 2
  render_camera: ['zed_cam_left']
  checkpoint_metric: "success"
  max_steps: 400



wandb:
  enable: false
  disable_artifact: true
  project: ${env.task}_finetune
  notes: ""
  save_code: false

policy:
  name: diffusion
  n_action_steps: 8
  ft_denoising_steps: 5
