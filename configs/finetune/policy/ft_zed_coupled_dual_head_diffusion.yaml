# @package _global_
# ZED耦合双扩散头模型的联合DPPO微调配置。

seed: 1000

env:
  n_envs: 2

training:
  pretrained_ckpt_path: "outputs/2_pretrain/train/REPLACE_WITH_COUPLED_CHECKPOINT"
  n_train_itr: 1000
  n_critic_warmup_itr: 2
  rollout_steps: 800
  batch_size: 32
  update_epochs: 10

  # 耦合参数同时影响两个动作条件均值，建议使用both。
  train_head: both
  view_loss_coef: null
  train_vision_encoder: false

  actor_lr: 5e-7
  critic_lr: 5e-5
  critic_hidden_dims: [256, 256, 256]
  critic_activation: Mish
  critic_use_layernorm: false
  actor_weight_decay: 0.0
  critic_weight_decay: 0.0
  lr_backbone: 1e-5
  actor_lr_warmup_iters: 5

  gamma: 0.999
  gae_lambda: 0.95
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3.0
  gamma_denoising: 0.99
  target_kl: 1e-4
  bc_coef: 0.0

  reward_source: binary_success_label
  reward_scale_running: false
  reward_scale_const: 1.0
  norm_adv: true
  clip_advantage_lower_quantile: 0.05
  clip_advantage_upper_quantile: 0.95

  min_sampling_denoising_std: 0.01
  min_logprob_denoising_std: 0.01
  ddim_eta: 0.0
  randn_clip_value: 3.0
  logprob_reduction: mean
  ppo_ratio_mode: joint_dim_mean
  use_disk_cache: true
  disk_cache_dir: "outputs/buffer/finetune_dppo_coupled_dual_head"
  grad_accumulate: 16
  post_update_probe_size: 256
  rollout_policy: dppo
  skip_update: false
  update_actor: true
  ref_bc_early_stop: null

  min_actor_update_success_rate: 0.0
  min_actor_update_avg_return: -100.0
  rollback_on_eval_collapse: true
  rollback_success_rate: 0.1
  rollback_reward: -100.0
  rollback_patience: 1

eval:
  eval_freq: 1
  render_camera: ['zed_cam_left']
  checkpoint_metric: success
  max_steps: 400

wandb:
  enable: false
  disable_artifact: true
  project: ${env.task}_finetune_coupled_dual_head
  notes: ""
  save_code: false

policy:
  name: coupled_dual_head_diffusion
  arm_action_dim: 14
  view_action_dim: 6
  coupling_num_heads: 8
  coupling_dropout: 0.0
  # 实际微调会读取预训练checkpoint中的policy配置；此处保留可见的模式选项说明。
  # 可选full、rbac、balanced_lookahead、rcla、bidirectional_prefix_to_suffix。
  coupling_mode: bidirectional_prefix_to_suffix
  coupling_block_type: role_adaln_zero
  coupling_use_temporal_pos_emb: true
  coupling_use_ffn: true
  coupling_ffn_ratio: 2.0
  view_to_arm_coupling_scale: 1.0
  arm_to_view_coupling_scale: 1.0
  n_action_steps: 8
  ft_denoising_steps: 10
