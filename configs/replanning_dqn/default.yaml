hydra:  # Hydra运行目录、任务名和日志写入方式。
  run:
    dir: outputs/4_replanning_dqn/train/${now:%Y-%m-%d}/${now:%H-%M-%S}_${env.task}  # 本次训练的输出目录。
  job:
    name: ${env.task}_replanning_dqn_${now:%Y-%m-%d}_${now:%H-%M-%S}  # Hydra任务名，同时用作W&B run名。
  job_logging:
    handlers:
      file:
        mode: a  # 以追加模式写日志，避免续训时覆盖原日志。

pretrained_ckpt_path: null  # 预训练checkpoint目录，也可直接指向其pretrained_model子目录。
resume_dqn_path: null       # 待恢复的DQN checkpoint文件或所在目录；null表示从头训练。
device: cuda:0              # 扩散策略和DQN的计算设备。
seed: 1000                  # 训练环境、探索、采样和扩散噪声的基础随机种子。

env:  # MuJoCo训练环境配置。
  name: guided_vision             # Gym环境命名空间，与task组成完整环境ID。
  task: InsertCylinder-3Arms-v0   # 具体任务名称。
  max_episode_steps: 400          # 单个episode最多执行的物理环境步数。
  enable_reward_debug: true       # 是否让环境在info中输出奖励调试信息。

dqn:  # Double DQN网络结构与优化参数。
  visual_embed_dim: 256    # 冻结视觉特征投影后的嵌入维数。
  state_embed_dim: 128     # 机器人低维状态投影后的嵌入维数。
  chunk_embed_dim: 128     # Arm或View剩余动作块的编码维数。
  hidden_dim: 256          # Dueling Q网络融合主干的隐藏层维数。
  gamma: 0.99              # TD目标的未来回报折扣因子，取值范围[0, 1]。
  learning_rate: 1.0e-4   # 在线Q网络的AdamW学习率。
  weight_decay: 0.0       # AdamW权重衰减系数。
  target_update_tau: 0.005  # 目标Q网络Polyak软更新系数，越小更新越平滑。
  grad_clip_norm: 10.0    # 在线Q网络的梯度范数裁剪上限。

reward:  # DQN即时奖励的组成系数。
  env_reward_scale: 0.01         # 原始环境奖励的缩放系数。
  view_only_replan_cost: 0.01    # 选择仅View重规划时扣除的推理代价。
  joint_replan_cost: 0.02        # 选择Arm/View联合重规划时扣除的推理代价。
  arm_discontinuity_coef: 0.01   # 联合重规划前后Arm动作跳变的惩罚系数。

training:  # 在线采集、探索和DQN更新配置。
  total_env_steps: 200000           # 训练最多执行的物理环境步数。
  replay_capacity: 100000           # CPU经验回放池最多保存的transition数量。
  learning_starts: 5000             # 开始DQN梯度更新前至少收集的transition数量。
  batch_size: 256                   # 每次DQN更新从回放池采样的transition数量。
  train_frequency: 1               # 每间隔多少个环境步触发一组DQN更新。
  updates_per_step: 1              # 每个更新点连续执行的梯度更新次数。
  warmup_continue_probability: 0.80  # 预热阶段在合法时随机选择“继续执行”的概率。
  epsilon_start: 0.20              # epsilon-greedy探索率的初始值。
  epsilon_end: 0.02                # 线性衰减后保留的最低探索率。
  epsilon_decay_steps: 100000      # epsilon从初始值线性衰减到最低值所用的环境步数。
  min_steps_after_replan: 2        # 联合重规划后至少执行的缓存步数，用于限制立即重规划。
  view_only_available: false       # 是否开放仅View重规划；当前训练入口尚未实现，必须保持false。
  log_freq_episodes: 1             # 每完成多少个episode输出一次训练日志。
  eval_freq_steps: 10000           # 每累计多少个训练环境步执行一次评估。
  save_freq_steps: 10000           # 每累计多少个训练环境步保存一次DQN checkpoint。

eval:  # 独立评估阶段配置，其环境步不计入total_env_steps。
  n_episodes: 10  # 每次评估运行的episode数量。
  seed: 2000      # 评估episode派生随机种子的基础值。

wandb:  # Weights & Biases实验记录配置。
  enable: false                           # 是否启用W&B在线记录。
  project: ${env.task}_replanning_dqn    # W&B项目名称。
  notes: ""                               # 附加到W&B run的实验备注。
  disable_system_stats: true             # 是否禁用CPU、GPU和内存等系统指标采集。
  disable_machine_info: true             # 是否禁用主机硬件和系统信息采集。
